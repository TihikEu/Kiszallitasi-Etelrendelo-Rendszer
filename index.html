<!DOCTYPE html>
<html lang="hu" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/ai.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/radar.css" />

  <title>Kiszállítási &amp; Ételrendelő Rendszer</title>
</head>

<body class="animated-gradient py-2 d-flex flex-column align-items-end justify-content-center gap-2">
  <header class="flex-grow-1 m-0">
    <div class="container rounded-1 my-4">
      <nav class="d-flex align-items-center justify-content-between">
        <h1 class="m-0 px-1">Adminisztricaos Felulet</h1>
        <h2 class="m-0 py-4 d-flex align-items-center justify-content-center real-time-ora"></h2>
      </nav>
    </div>
  </header>
  <main>
    <section>
      <div class="container">
        <div class="layout">
          <div class="d-flex flex-column gap-3">
            <div class="p-3 rounded-1 card card-ico">
              <h2>Rendelesek allapota</h2>
              <div class="d-flex align-items-center gap-3 justify-content-center">
                <span class="span-hover c rounded-1 w-50 p-3 aktiv text-center"></span>
                <span class="span-hover c rounded-1 w-50 p-3 futar text-center"></span>
              </div>
            </div>
            <div class="p-3 rounded-1 card card-ico map-card">
              <h2>Szallitasi zonak terkepe</h2>
              <span class="span-hover c rounded-1 map w-100 p-3 fw-bold text-center d-block position-relative"></span>
            </div>
            <div class="p-3 rounded-1 card card-ico">
              <h2>Teljesitmenymutatok</h2>
              <div class="d-flex align-items-center gap-3 justify-content-center">
                <span class="span-hover c text-center rounded-1 w-100 p-3 atlagIdo"></span>
                <span class="span-hover c text-center rounded-1 w-100 p-3 szallitasiZonak"></span>
              </div>
            </div>
          </div>
          <div class="col-right">
            <div class="col-right-inner">
              <div class="d-flex flex-column flex-md-row gap-3 mb-3">
                <div class="p-3 rounded-1 w-100 card card-ico d-flex flex-column">
                  <h2>Aktiv szallitasok ossz erteke</h2>
                  <span
                    class="span-hover c osszeg w-100 rounded-1 p-3 text-center flex-grow-1 d-flex flex-column justify-content-center align-items-center"></span>
                </div>
                <div class="p-3 rounded-1 w-100 card card-ico legkozelebbi-card">
                  <h2>Legkozelebbi rendeles</h2>
                  <div class="d-flex align-items-center gap-3 justify-content-center">
                    <span class="span-hover c text-center rounded-1 w-100 p-3 legkozelebbi-ido"></span>
                    <span class="span-hover c text-center rounded-1 w-100 p-3 legkozelebbi-id"></span>
                  </div>
                </div>
              </div>

              <div class="accordion accordion-flush">
                <div class="accordion-item">
                  <div class="accordion-header p-3" id="flush-headingOne">
                    <div class="row g-2 align-items-center">
                      <div class="col-md-9">
                        <h2 class="m-0">Rendelesek</h2>
                      </div>
                      <div class="col-md-3 d-flex justify-content-end">
                        <button type="button" class="btn btn-dark uj-rendeles" data-bs-toggle="collapse"
                          data-bs-target="#flush-collapseOne" aria-expanded="false" aria-controls="flush-collapseOne">
                          Uj Rendeles
                        </button>
                      </div>
                    </div>
                  </div>
                  <div id="flush-collapseOne" class="accordion-collapse collapse" aria-labelledby="flush-headingOne">
                    <div class="collapse-inner px-3 py-4">
                      <form>
                        <div class="row g-3 mb-3">
                          <div class="col-md-6">
                            <label class="form-label form-text text-body">Megrendelo Neve</label>
                            <input type="text" class="form-control ugyfelNev" placeholder="Kiss Anna">
                          </div>
                          <div class="col-md-6">
                            <label class="form-label form-text text-body">Szallitasi Cim</label>
                            <input type="text" class="form-control szallitasiCim" placeholder="Vadasz u. 12.">
                          </div>
                        </div>
                        <div class="row g-3 mb-3">
                          <div class="col-md-3">
                            <label class="form-label form-text text-body">Etel Neve</label>
                            <input type="text" class="form-control etelNev" placeholder="Margarita pizza">
                          </div>
                          <div class="col-md-3">
                            <label class="form-label form-text text-body">Statusz</label>
                            <select class="form-select text-body statusz">
                              <option selected value="Keszul">Keszul</option>
                              <option value="Futarnal">Futarnal</option>
                              <option value="Kiszallitva">Kiszallitva</option>
                            </select>
                          </div>
                          <div class="col-md-3">
                            <label class="form-label form-text text-body">Osszeg ( Ft )</label>
                            <input type="number" class="form-control input_osszeg" min="0" placeholder="3490">
                          </div>
                          <div class="col-md-3">
                            <label class="form-label form-text text-body">Kiszallitasi Ido ( Perc )</label>
                            <input type="number" class="form-control hataraidPerc" min="0" placeholder="20">
                          </div>
                        </div>
                        <div class="row g-3 mt-3">
                          <div class="col-md-3 offset-md-9 gombok d-flex gap-3">
                            <button type="button" class="btn btn-dark w-50 megse" data-bs-toggle="collapse"
                              data-bs-target="#flush-collapseOne">Megse</button>
                            <button type="button" class="btn btn-dark w-50 hozzaadas">Uj Hozzaadas</button>
                            <button type="button" class="btn btn-dark d-none w-50 mentes">Mentes</button>
                          </div>
                        </div>
                      </form>
                    </div>
                  </div>
                </div>
              </div>
              <div class="filter p-3">
                <div class="row g-3 align-items-center">
                  <div class="col-md-9">
                    <input type="text" class="form-control kereses" placeholder="Kereses nev, cim vagy etel szerint">
                  </div>
                  <div class="col-md-3">
                    <select class="form-select text-body keres-select">
                      <option selected value="Osszes">Osszes Statusz</option>
                      <option value="Keszul">Keszul</option>
                      <option value="Futarnal">Futarnal</option>
                      <option value="Kiszallitva">Kiszallitva</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="rendelesek ps-3 pb-3 border-start border-end border-bottom">
                <table class="table m-0 align-middle">
                  <thead class="border-bottom">
                    <tr class="text-uppercase">
                      <th class="px-3 py-0 m-0 form-text" scope="col">Id</th>
                      <th class="px-3 py-0 m-0 form-text" scope="col">Megrendelo</th>
                      <th class="px-3 py-0 m-0 form-text" scope="col">Etel</th>
                      <th class="px-3 py-0 m-0 form-text" scope="col">Statusz</th>
                      <th class="p-0" scope="col"></th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
                <h2 class="nincs-rendeles m-0 d-none text-center text-uppercase">Nincs rendeles</h2>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="flex-grow-1 m-0">
    <div class="container rounded-1 my-4">
      <p class="text-center m-0 py-4">Minden jog fenntartva! 2026 &copy;</p>
    </div>
  </footer>

  <div class="modal fade" id="exampleModalToggle" aria-hidden="true" aria-labelledby="exampleModalToggleLabel"
    tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalToggleLabel">Rendeles</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-footer justify-content-between">
          <div class="d-flex align-items-center gap-3">
            <button class="btn btn-danger" data-bs-target="#exampleModalToggle2" data-bs-toggle="modal">Torles</button>
            <div data-bs-toggle="collapse" data-bs-target="#flush-collapseOne" aria-expanded="false"
              aria-controls="flush-collapseOne">
              <button class="btn btn-warning szerkeszt" data-bs-dismiss="modal">Szerkesztes</button>
            </div>
          </div>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Bezar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="exampleModalToggle2" aria-hidden="true" aria-labelledby="exampleModalToggleLabel2"
    tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalToggleLabel2">Torles</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="m-0">Biztos szeretne torolni?</p>
        </div>
        <div class="modal-footer justify-content-between">
          <button class="btn btn-danger torol" data-bs-dismiss="modal">Torles</button>
          <button class="btn btn-secondary" data-bs-target="#exampleModalToggle" data-bs-toggle="modal">Megse</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="SuccessModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Bezar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="ErrorModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title">Hiba!</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Rendben</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/Rendeles.js"></script>
  <script src="js/Etelek.js"></script>
  <script src="js/radar.js"></script>
  <script src="js/main.js"></script>
  <script src="js/teszteles.js"></script>
</body>

</html>
